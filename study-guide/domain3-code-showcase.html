<title>Domain 3 — Code Showcase</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e18;
    --surface: #161625;
    --surface2: #1e1e30;
    --border: #2a2a40;
    --text: #d0d0e0;
    --text-dim: #7a7a95;
    --accent: #f0813a;
    --accent-dim: rgba(240,129,58,0.12);
    --teal: #3ac5a8;
    --teal-dim: rgba(58,197,168,0.12);
    --purple: #9b7aed;
    --purple-dim: rgba(155,122,237,0.12);
    --red: #e85d4a;
    --red-dim: rgba(232,93,74,0.12);
    --yellow: #ebc95a;
    --yellow-dim: rgba(235,201,90,0.12);
    --blue: #5aa8eb;
    --blue-dim: rgba(90,168,235,0.12);
    --green: #5aeb87;
    --comment: #555570;
    --keyword: #c792ea;
    --string: #c3e88d;
    --func: #82aaff;
    --tag: #f07178;
    --attr: #ffcb6b;
    --mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    min-height: 100vh;
  }

  .header {
    padding: 50px 32px 36px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -80px; left: 50%; transform: translateX(-50%);
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(240,129,58,0.06) 0%, transparent 70%);
    pointer-events: none;
  }
  .header-badge {
    display: inline-block;
    font-family: var(--mono);
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-dim);
    padding: 5px 14px;
    border-radius: 20px;
    margin-bottom: 14px;
  }
  .header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    font-weight: 400;
    color: #fff;
    margin-bottom: 8px;
  }
  .header h1 span { color: var(--accent); }
  .header p { color: var(--text-dim); font-size: 0.92rem; }

  .section-nav {
    display: flex;
    gap: 6px;
    padding: 16px 32px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .section-btn {
    font-family: var(--mono);
    font-size: 0.74rem;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .section-btn:hover { border-color: var(--accent); color: var(--text); }
  .section-btn.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  .main { max-width: 960px; margin: 0 auto; padding: 32px; }
  .panel { display: none; }
  .panel.active { display: block; }

  .task-header { margin-bottom: 32px; }
  .task-num {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--accent);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .task-header h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.7rem;
    color: #fff;
    font-weight: 400;
  }
  .task-desc {
    color: var(--text-dim);
    font-size: 0.9rem;
    margin-top: 8px;
    max-width: 700px;
  }

  .explorer {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .explorer-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 18px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--text-dim);
  }
  .dots { display: flex; gap: 5px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot-r { background: #e85d4a; }
  .dot-y { background: #ebc95a; }
  .dot-g { background: #5aeb87; }

  .tree {
    padding: 18px 20px;
    font-family: var(--mono);
    font-size: 0.8rem;
    line-height: 2;
  }
  .tree-line {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 2px 8px;
    border-radius: 5px;
    transition: background 0.15s;
  }
  .tree-line:hover { background: rgba(255,255,255,0.03); }
  .tree-icon { font-size: 0.85rem; width: 18px; text-align: center; flex-shrink: 0; }
  .tree-name { color: var(--text); }
  .tree-line.dir .tree-name { color: var(--blue); }
  .tree-line.special .tree-name { color: var(--teal); }
  .tree-annotation {
    margin-left: auto;
    font-size: 0.68rem;
    padding: 2px 10px;
    border-radius: 10px;
    white-space: nowrap;
  }
  .ann-auto { background: var(--teal-dim); color: var(--teal); }
  .ann-manual { background: var(--accent-dim); color: var(--accent); }
  .ann-passive { background: var(--purple-dim); color: var(--purple); }
  .ann-personal { background: var(--yellow-dim); color: var(--yellow); }
  .ann-condition { background: var(--blue-dim); color: var(--blue); }
  .ann-shared { background: var(--teal-dim); color: var(--teal); }

  .code-viewer {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .code-tab-bar {
    display: flex;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .code-tab {
    font-family: var(--mono);
    font-size: 0.74rem;
    padding: 10px 18px;
    color: var(--text-dim);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .code-tab:hover { color: var(--text); background: rgba(255,255,255,0.02); }
  .code-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .code-pane { display: none; }
  .code-pane.active { display: block; }
  .code-content {
    padding: 20px 24px;
    font-family: var(--mono);
    font-size: 0.8rem;
    line-height: 1.9;
    overflow-x: auto;
    white-space: pre;
    counter-reset: line;
  }
  .code-content .line { display: block; }
  .code-content .line::before {
    counter-increment: line;
    content: counter(line);
    display: inline-block;
    width: 30px;
    margin-right: 20px;
    text-align: right;
    color: #3a3a50;
    font-size: 0.72rem;
    user-select: none;
  }

  .cm { color: var(--comment); font-style: italic; }
  .kw { color: var(--keyword); }
  .st { color: var(--string); }
  .fn { color: var(--func); }
  .tg { color: var(--tag); }
  .at { color: var(--attr); }
  .ac { color: var(--accent); }
  .vr { color: var(--teal); }
  .nm { color: var(--yellow); }

  .annotation {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    font-size: 0.82rem;
    color: var(--text-dim);
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: rgba(240,129,58,0.04);
  }
  .annotation strong { color: var(--text); }
  .annotation code {
    font-family: var(--mono);
    font-size: 0.78rem;
    background: rgba(255,255,255,0.06);
    padding: 1px 6px;
    border-radius: 3px;
  }
  .ann-icon {
    flex-shrink: 0;
    width: 22px; height: 22px;
    background: var(--accent-dim);
    color: var(--accent);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 700;
    margin-top: 1px;
  }
  .annotation.teal-ann { background: rgba(58,197,168,0.04); }
  .annotation.teal-ann .ann-icon { background: var(--teal-dim); color: var(--teal); }
  .annotation.purple-ann { background: rgba(155,122,237,0.04); }
  .annotation.purple-ann .ann-icon { background: var(--purple-dim); color: var(--purple); }
  .annotation.red-ann { background: rgba(232,93,74,0.04); }
  .annotation.red-ann .ann-icon { background: var(--red-dim); color: var(--red); }

  .concept-box {
    background: linear-gradient(135deg, #1a1a30, #22223a);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
  }
  .concept-box h4 {
    font-family: 'DM Serif Display', serif;
    font-weight: 400;
    font-size: 1.05rem;
    color: var(--accent);
    margin-bottom: 14px;
  }
  .concept-row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 8px;
    font-size: 0.85rem;
  }
  .concept-label {
    font-family: var(--mono);
    font-size: 0.72rem;
    padding: 3px 10px;
    border-radius: 4px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .cl-orange { background: var(--accent-dim); color: var(--accent); }
  .cl-teal { background: var(--teal-dim); color: var(--teal); }
  .cl-purple { background: var(--purple-dim); color: var(--purple); }
  .cl-red { background: var(--red-dim); color: var(--red); }
  .cl-blue { background: var(--blue-dim); color: var(--blue); }

  .flow-visual {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 20px 0;
    flex-wrap: wrap;
  }
  .flow-box {
    padding: 10px 16px;
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 0.78rem;
    font-weight: 600;
    border: 1px solid;
  }
  .fb-orange { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .fb-teal { background: var(--teal-dim); border-color: var(--teal); color: var(--teal); }
  .fb-purple { background: var(--purple-dim); border-color: var(--purple); color: var(--purple); }
  .fb-red { background: var(--red-dim); border-color: var(--red); color: var(--red); }
  .flow-arrow { color: var(--text-dim); font-size: 1rem; }

  @media (max-width: 640px) {
    .main { padding: 20px 16px; }
    .section-nav { padding: 12px 16px; }
    .code-content { font-size: 0.72rem; padding: 14px 16px; }
    .header { padding: 36px 20px 28px; }
  }
</style>
</head>

        <div class="code-pane" data-cv="cv35" data-idx="2"><div class="code-content"><span class="line"><span class="cm"># You tell Claude Code:</span></span><span class="line"><span class="st">"I need a caching layer for our product catalog.</span></span><span class="line"><span class="st"> Interview me first to surface what I haven't thought about."</span></span><span class="line"></span><span class="line"><span class="cm"># Claude Code asks:</span></span><span class="line"></span><span class="line"><span class="vr">1. Invalidation strategy</span></span><span class="line">   Time-based TTL? Event-based? Manual purge?</span><span class="line"></span><span class="line"><span class="vr">2. Consistency requirements</span></span><span class="line">   Is a 30-second stale price acceptable?</span><span class="line"></span><span class="line"><span class="vr">3. Cache miss under load</span></span><span class="line">   1000 requests hit empty cache — all query DB,</span><span class="line">   or use a lock/single-fill pattern?</span><span class="line"></span><span class="line"><span class="vr">4. Cold start after deployment</span></span><span class="line">   Warm up preemptively or fill on demand?</span><span class="line"></span><span class="line"><span class="vr">5. Memory limits</span></span><span class="line">   10K products × ~2KB = ~20MB.</span><span class="line">   Full catalog or LRU subset?</span><span class="line"></span><span class="line"><span class="cm"># You answer → Claude Code implements with full picture</span></span></div><div class="annotation purple-ann"><div class="ann-icon">?</div><div><strong style="color:var(--purple)">Plan mode for requirements.</strong> You knew you wanted caching. You hadn't thought about thundering herd or cold start. The interview prevents discover → rework → repeat.</div></div></div>

        <div class="code-pane" data-cv="cv36" data-idx="1"><div class="code-content"><span class="line"><span class="cm"># CI: Generate tests — include existing to avoid duplicates</span></span><span class="line"></span><span class="line"><span class="at">- name</span>: <span class="st">Generate Missing Tests</span></span><span class="line">  <span class="at">run</span>: |</span><span class="line">    <span class="vr">EXISTING_TESTS</span>=$(<span class="fn">find</span> . -name "*.test.*" -type f)</span><span class="line"></span><span class="line">    claude <span class="kw">-p</span> \</span><span class="line">      <span class="st">"Generate tests for changed files in this PR.</span></span><span class="line"></span><span class="line"><span class="st">       These test files ALREADY EXIST — don't duplicate:</span></span><span class="line"><span class="st">       $EXISTING_TESTS</span></span><span class="line"></span><span class="line"><span class="st">       Focus ONLY on:</span></span><span class="line"><span class="st">       - New functions not yet covered</span></span><span class="line"><span class="st">       - Missing edge cases</span></span><span class="line"><span class="st">       - Untested error paths</span></span><span class="line"></span><span class="line"><span class="st">       Follow testing conventions in CLAUDE.md."</span></span></div><div class="annotation teal-ann"><div class="ann-icon">✓</div><div><strong style="color:var(--teal)">Full context upfront:</strong> No human to say "we already have that." Existing tests in the prompt prevents duplication. CLAUDE.md provides standards.</div></div></div>

// Build nav + panels
const navEl = document.getElementById('sectionNav');
const mainEl = document.getElementById('mainContent');
sections.forEach((s, i) => {
  const btn = document.createElement('div');
  btn.className = 'section-btn' + (i === 0 ? ' active' : '');
  btn.dataset.idx = i;
  btn.textContent = s.label;
  navEl.appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'panel' + (i === 0 ? ' active' : '');
  panel.dataset.idx = i;
  panel.innerHTML = '<div class="task-header"><div class="task-num">'+s.num+'</div><h2>'+s.title+'</h2><p class="task-desc">'+s.desc+'</p></div>'+s.content;
  mainEl.appendChild(panel);
});

navEl.addEventListener('click', e => {
  const btn = e.target.closest('.section-btn');
  if (!btn) return;
  const idx = btn.dataset.idx;
  document.querySelectorAll('.section-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.querySelector('.panel[data-idx="'+idx+'"]').classList.add('active');
  window.scrollTo({ top: navEl.offsetTop, behavior: 'smooth' });
});

document.addEventListener('click', e => {
  const tab = e.target.closest('.code-tab');
  if (!tab) return;
  const cv = tab.dataset.cv, pane = tab.dataset.pane;
  document.querySelectorAll('.code-tab[data-cv="'+cv+'"]').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.code-pane[data-cv="'+cv+'"]').forEach(p => p.classList.remove('active'));
  tab.classList.add('active');
  document.querySelector('.code-pane[data-cv="'+cv+'"][data-idx="'+pane+'"]').classList.add('active');
});
</script>
